services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: docassist
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: docassist
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docassist"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  ollama:
    image: ollama/ollama
    volumes:
      - ollama:/root/.ollama


volumes:
  pgdata:
  ollama:
